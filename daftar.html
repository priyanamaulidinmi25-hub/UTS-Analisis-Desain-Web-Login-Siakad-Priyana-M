
<!DOCTYPE html>
<html>
<head>
    <title>Halaman Daftar</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="header">

        <div class="logo">
            <img src="logo-piksi.png" class="gambar">
            <b>Siakad</b>
        </div>

        <div class="menu">
            <a href="index.html">Beranda</a>
            <a href="login.html">Login</a>
            <a href="daftar.html">Daftar</a>
        </div>

    </div>

    <div class="isi">

        <h2>Daftar</h2>

        <form>

            <table class="form-daftar">

                <tr>
                    <td>Username</td>
                    <td>
                        <input type="text">
                    </td>
                </tr>

                <tr>
                    <td>Password</td>
                    <td>
                        <input type="password">
                    </td>
                </tr>

                <tr>
                    <td>Ulangi Password</td>
                    <td>
                        <input type="password">
                    </td>
                </tr>

                <tr>
                    <td>Nama Lengkap</td>
                    <td>
                        <input type="text">
                    </td>
                </tr>

                <tr>
                    <td>Email</td>
                    <td>
                        <input type="email">
                    </td>
                </tr>

                <tr>
                    <td>Alamat</td>
                    <td>
                        <textarea></textarea>
                    </td>
                </tr>

                <tr>
                    <td>Nomor Telepon</td>
                    <td>
                        <input type="text">
                    </td>
                </tr>

                <tr>
                    <td>Jenis Kelamin</td>
                    <td>
                        <input type="radio" name="jk">
                        Laki-laki

                        <input type="radio" name="jk">
                        Perempuan
                    </td>
                </tr>

                <tr>
                    <td>Jurusan</td>
                    <td>
                        <select>
                            <option>Pilih Jurusan</option>
                            <option>Manajemen Informatika</option>
                            <option>Akuntansi</option>
                            <option>Bisnis Digital</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>Foto Profil</td>
                    <td>
                        <input type="file">
                    </td>
                </tr>

            </table>

            <br>

            <button type="submit">Daftar</button>

            <a href="index.html">
                <button type="button">Kembali</button>
            </a>

        </form>

    </div>

    <div class="footer">

        © 2026 Priyana Maulidin - 2557401009 - Kelas MI 25

        <span class="footer-kanan">
            <a href="#">Instagram</a>
            <a href="#">Email</a>
        </span>

    </div>

</body>
</html>
